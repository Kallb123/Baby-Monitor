# Reviews every pull request with Claude Code, using the project's `pr-review`
# skill and the vendored `cavecrew-reviewer` agent (see .claude/).
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
# or ANTHROPIC_API_KEY. Without it the job is skipped instead of failing.
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check for credentials
        id: creds
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Claude credentials configured; skipping review."
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.creds.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request by following the `pr-review` skill in
            .claude/skills/pr-review/SKILL.md. Use the `cavecrew-reviewer`
            agent for the line-level pass, then apply the project checklist.
            Post 🔴 and 🟡 findings as inline comments and finish with one
            summary comment, as the skill describes.
          claude_args: |
            --allowedTools "Task,Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
